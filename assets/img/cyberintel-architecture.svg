<title id="title">CyberIntel Database</title><desc id="desc">Four-table CyberIntel schema. VULNERABILITIES has one-to-many relationships with AFFECTED_SOFTWARE and EXPLOIT_REFERENCES. SOFTWARE has a one-to-many relationship with AFFECTED_SOFTWARE. Version inclusivity flags are retained.</desc>
